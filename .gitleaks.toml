title = "Gitleaks Configuration"

# Use the bundled default rules and add our own allowlist on top.
[extend]
useDefault = true

[allowlist]
  description = "Ignore lockfiles and frozen artifacts (high false-positive rate)"
  paths = [
    '''pnpm-lock\.yaml''',
    '''package-lock\.json''',
    '''yarn\.lock''',
    '''poetry\.lock''',
  ]
  # A credential made only of an environment variable reference is not a secret:
  # `curl -u "logstash_writer:$${LOGSTASH_WRITER_PASSWORD}"` in docker-compose.yml
  # tripped curl-auth-user.
  regexTarget = "match"
  regexes = [
    '''-u\s+["']?[A-Za-z0-9_.-]+:\$\$?\{[A-Z0-9_]+\}["']?''',
  ]
