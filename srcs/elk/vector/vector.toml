# Vector — container log shipper for the ELK stack.
#
# Replaces Filebeat. Filebeat harvested /var/lib/docker/containers/*/*.log from
# the host, which only holds anything when the Docker daemon's data root is on
# that same filesystem, i.e. a native Linux Docker Engine. Under Docker Desktop
# the engine keeps those files inside its own VM: the bind mount resolved to an
# empty directory and Filebeat ran with zero harvesters, so nothing was ever
# shipped. Vector reads the same logs over the Docker API, which behaves the
# same on Docker Desktop and native Docker, and needs no change to the
# json-file log driver — `docker logs` and `make logs` keep working.

data_dir = "/var/lib/vector"

[api]
enabled = false

[sources.docker]
type = "docker_logs"
# Skip the logging stack's own containers: without this, Logstash's and
# Elasticsearch's output is re-ingested as input and the pipeline feeds itself.
exclude_containers = [
  "ft_transcendence_elasticsearch",
  "ft_transcendence_logstash",
  "ft_transcendence_kibana",
  "ft_transcendence_elk_setup",
  "ft_transcendence_vector",
]

# Reshape into the event layout the Logstash pipeline and the Elasticsearch
# index template already expect from the Filebeat era: the raw log line stays
# in `message` for the json/grok filters to parse, Docker metadata sits under
# `container.*`. Keeping the shape identical means no pipeline or mapping
# changes were needed to swap the shipper.
[transforms.shape]
type = "remap"
inputs = ["docker"]
source = '''
. = {
  "message": .message,
  "container": {
    "name": .container_name,
    "image": { "name": .image }
  },
  "stream": .stream
}
'''

[sinks.logstash]
type = "socket"
mode = "tcp"
inputs = ["shape"]
address = "logstash:5044"

[sinks.logstash.encoding]
codec = "json"

# TLS is kept on this hop so the swap does not weaken what the beats input had.
# Logstash presents the cert elasticsearch-certutil issued for the `logstash`
# DNS name; Vector verifies it against the same CA every other component uses.
[sinks.logstash.tls]
enabled = true
ca_file = "/certs/ca/ca.crt"
verify_certificate = true
verify_hostname = true
