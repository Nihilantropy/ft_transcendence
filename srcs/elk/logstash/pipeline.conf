input {
  beats {
    port => 5044
    ssl_enabled => true
    ssl_certificate => "/usr/share/logstash/config/certs/logstash/logstash.crt"
    ssl_key => "/usr/share/logstash/config/certs/logstash/logstash.key"
  }
}

filter {
  # api-gateway, ai-service and nginx all emit one JSON object per line.
  json {
    source => "message"
    skip_on_invalid_json => true
  }

  # Fallback for the remaining plain-text loggers (classification-service,
  # Django dev servers, ollama, litellm): grok the common
  # "TIMESTAMP - name - LEVEL - message" shape, leave anything else as-is.
  if ![level] {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:log_timestamp}\s*-\s*%{DATA:logger_name}\s*-\s*%{LOGLEVEL:level}\s*-\s*%{GREEDYDATA:log_message}"
      }
      tag_on_failure => ["_grokparsefailure_plain"]
    }
  }

  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    tag_on_failure => ["_dateparsefailure"]
  }
}

output {
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    ssl_enabled => true
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]
    user => "logstash_writer"
    password => "${LOGSTASH_WRITER_PASSWORD}"
    data_stream => true
    data_stream_dataset => "smartbreeds"
    data_stream_namespace => "default"
  }
}
