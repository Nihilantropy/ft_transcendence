input {
  # Vector ships container logs here as newline-delimited JSON.
  #
  # This replaced a beats input fed by Filebeat, which read log FILES from
  # /var/lib/docker/containers. Those exist only when the Docker daemon's data
  # root sits on the same filesystem — a native Linux Engine. Under Docker
  # Desktop the engine keeps them inside its own VM, so the bind mount was an
  # empty directory and Filebeat ran with zero harvesters: the stack shipped
  # nothing at all. Vector reads the Docker API instead, which works either way
  # and leaves the json-file driver alone so `docker logs` keeps working.
  tcp {
    port => 5044
    codec => json_lines
    ssl_enabled => true
    ssl_certificate => "/usr/share/logstash/config/certs/logstash/logstash.crt"
    # PKCS#8, converted by srcs/elk/setup/entrypoint.sh: this input rejects the
    # PKCS#1 key elasticsearch-certutil writes, which the beats input accepted.
    ssl_key => "/usr/share/logstash/config/certs/logstash/logstash.pkcs8.key"
    # Server-side TLS only. Unlike the beats input, this one asks for a client
    # certificate by default and rejects the handshake when none arrives
    # ("tls alert bad certificate", alert 42). Vector authenticates the server,
    # not the other way round — the hop is internal to backend-network.
    ssl_client_authentication => "none"
  }
}

# Every service logs in its own shape. This filter normalises them all onto ONE
# schema, which is what the pre-built Kibana dashboards (srcs/elk/kibana/) query:
#
#   service            compose-style name from the container (api-gateway, nginx, db, ...)
#   level              DEBUG | INFO | WARNING | ERROR | CRITICAL
#   log_type           access (one line per HTTP request) | app (everything else)
#   http.layer         edge (nginx) | gateway (api-gateway's JSON request log) | service
#                      (a backend's own access line). The same request appears once per
#                      layer it crosses, so a panel must pick ONE layer or it double counts
#   http.method / http.status / http.status_class / http.duration_ms
#   url.path           path WITHOUT the query string (see the redaction below)
#   client.ip / user.id / healthcheck (true for container healthcheck probes)
filter {
  # Secrets travel in query strings: the 42 OAuth callback carries a one-time
  # `code` and the CSRF `state`. Scrub them before anything is parsed or stored.
  mutate {
    gsub => ["message", "([?&](?:code|state|token|access_token|refresh_token|mfa_token)=)[^&\s\"]+", "\1[REDACTED]"]
  }

  mutate {
    copy => { "[container][name]" => "service" }
  }
  mutate {
    gsub => ["service", "^ft_transcendence_", "", "service", "_", "-"]
  }

  if [message] =~ /^\s*\{/ {
    # api-gateway and nginx emit one JSON object per line.
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }
  }

  if [parsed][request_uri] {
    # --- nginx access log (srcs/nginx/nginx.conf `log_format main`) ---------
    mutate {
      add_field => { "log_type" => "access" "[http][layer]" => "edge" }
      rename => {
        "[parsed][request_method]" => "[http][method]"
        "[parsed][request_uri]" => "[url][original]"
        "[parsed][status]" => "[http][status]"
        "[parsed][body_bytes_sent]" => "[http][response_bytes]"
        "[parsed][remote_addr]" => "[client][ip]"
        "[parsed][http_user_agent]" => "[user_agent][original]"
        "[parsed][http_referer]" => "[http][referrer]"
        "[parsed][upstream_addr]" => "[http][upstream]"
        "[parsed][request_id]" => "request_id"
      }
    }
    ruby {
      code => "t = event.get('[parsed][request_time]'); event.set('[http][duration_ms]', (t.to_f * 1000).round(2)) unless t.nil?"
    }
  } else if [parsed][status_code] {
    # --- api-gateway structured request log (middleware/logging) ------------
    mutate {
      add_field => { "log_type" => "access" "[http][layer]" => "gateway" }
      rename => {
        "[parsed][method]" => "[http][method]"
        "[parsed][path]" => "[url][original]"
        "[parsed][status_code]" => "[http][status]"
        "[parsed][duration_ms]" => "[http][duration_ms]"
        "[parsed][client_ip]" => "[client][ip]"
        "[parsed][user_id]" => "[user][id]"
        "[parsed][request_id]" => "request_id"
        "[parsed][logger]" => "logger"
        "[parsed][level]" => "level"
      }
    }
  } else if [parsed] {
    # --- any other JSON line (api-gateway / ai-service application logs) -----
    mutate {
      add_field => { "log_type" => "app" }
      rename => {
        "[parsed][level]" => "level"
        "[parsed][logger]" => "logger"
        "[parsed][request_id]" => "request_id"
        "[parsed][user_id]" => "[user][id]"
      }
    }
    if [parsed][message] {
      mutate { replace => { "message" => "%{[parsed][message]}" } }
    }
  } else {
    # --- plain-text lines: first matching shape wins -------------------------
    grok {
      match => {
        "message" => [
          # uvicorn access: INFO:     172.18.0.11:50110 - "GET /api/v1/pets HTTP/1.0" 200 OK
          "^%{LOGLEVEL:level}:\s+%{IP:[client][ip]}:%{INT} - \"%{WORD:[http][method]} %{NOTSPACE:[url][original]} HTTP/[\d.]+\" %{INT:[http][status]:int}",
          # Django runserver access: [06/Oct/2026 14:25:30] "GET /api/v1/pets HTTP/1.1" 200 81
          "^\[[^\]]+\] \"%{WORD:[http][method]} %{NOTSPACE:[url][original]} HTTP/[\d.]+\" %{INT:[http][status]:int} %{INT:[http][response_bytes]:int}",
          # Python logging: 2026-10-06 14:25:30,123 - name - LEVEL - message
          "^%{TIMESTAMP_ISO8601}\s*-\s*%{DATA:logger}\s*-\s*%{LOGLEVEL:level}\s*-\s*%{GREEDYDATA}",
          # uvicorn / FastAPI app line: INFO:     Application startup complete.
          "^%{LOGLEVEL:level}:\s+%{GREEDYDATA}",
          # nginx error log: 2026/10/06 14:25:30 [warn] 13#13: ...
          "^\d{4}/\d\d/\d\d \d\d:\d\d:\d\d \[%{LOGLEVEL:level}\]",
          # PostgreSQL: 2026-10-06 14:12:00.756 UTC [59] LOG:  checkpoint complete
          "^%{TIMESTAMP_ISO8601} \w+ \[\d+\] %{WORD:level}:",
          # Redis: 1:M 06 Oct 2026 14:09:17.865 * Background saving started
          "^\d+:[A-Z] \d\d \w{3} \d{4} [\d:.]+ %{DATA:redis_level} "
        ]
      }
      tag_on_failure => []
    }
    if [http][status] {
      mutate { add_field => { "log_type" => "access" "[http][layer]" => "service" } }
    } else {
      mutate { add_field => { "log_type" => "app" } }
    }
  }

  # --- shared HTTP derivations -------------------------------------------------
  if [url][original] {
    grok {
      match => { "[url][original]" => "^%{DATA:[url][path]}(?:\?.*)?$" }
      tag_on_failure => []
    }
    if [url][path] =~ /^\/health/ {
      mutate { add_field => { "healthcheck" => "true" } }
    }
  }
  if [http][status] {
    mutate { convert => { "[http][status]" => "integer" } }
    ruby {
      code => "event.set('[http][status_class]', (event.get('[http][status]').to_i / 100).to_s + 'xx')"
    }
  }

  # --- level normalisation -------------------------------------------------------
  if [redis_level] {
    # Redis marks severity with a symbol: . debug, - verbose, * notice, # warning
    translate {
      source => "redis_level"
      target => "level"
      dictionary => { "." => "DEBUG" "-" => "DEBUG" "*" => "INFO" "#" => "WARNING" }
      fallback => "INFO"
    }
  }
  if [log_type] == "access" and [http][status] {
    # An access line's real severity is its status, whatever the logger printed:
    # the gateway logs a 500 at INFO, Django logs nothing at all.
    if [http][status] >= 500 {
      mutate { replace => { "level" => "ERROR" } }
    } else if [http][status] >= 400 {
      mutate { replace => { "level" => "WARNING" } }
    } else {
      mutate { replace => { "level" => "INFO" } }
    }
  }
  if ![level] {
    if [message] =~ /^Traceback|^\s+File "|^\s*[\w.]+(Error|Exception)(: |$)/ {
      mutate { add_field => { "level" => "ERROR" } }
    } else if [message] =~ /Warning: |^\s+warnings\.warn/ {
      mutate { add_field => { "level" => "WARNING" } }
    } else {
      mutate { add_field => { "level" => "INFO" } }
    }
  }
  mutate { uppercase => ["level"] }
  translate {
    source => "level"
    target => "level"
    override => true
    # nginx/PostgreSQL/Python spellings onto one scale. Anything unknown is kept as-is.
    dictionary => {
      "WARN" => "WARNING" "NOTICE" => "INFO" "LOG" => "INFO" "STATEMENT" => "INFO"
      "DETAIL" => "INFO" "HINT" => "INFO" "TRACE" => "DEBUG"
      "ERR" => "ERROR" "FATAL" => "CRITICAL" "PANIC" => "CRITICAL"
      "CRIT" => "CRITICAL" "ALERT" => "CRITICAL" "EMERG" => "CRITICAL"
    }
  }

  # --- readable message for structured lines ---------------------------------
  if [http][layer] in ["edge", "gateway"] {
    mutate {
      replace => { "message" => "%{[http][method]} %{[url][original]} %{[http][status]} (%{[http][duration_ms]} ms)" }
    }
  }

  # The JSON's own timestamp is more precise than Docker's receive time for the gateway.
  if [parsed][timestamp] {
    date {
      match => ["[parsed][timestamp]", "ISO8601"]
      target => "@timestamp"
      tag_on_failure => ["_dateparsefailure"]
    }
  }

  mutate { remove_field => ["parsed", "redis_level", "@version"] }
}

output {
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    ssl_enabled => true
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca/ca.crt"]
    user => "logstash_writer"
    password => "${LOGSTASH_WRITER_PASSWORD}"
    data_stream => true
    data_stream_dataset => "smartbreeds"
    data_stream_namespace => "default"
  }
}
