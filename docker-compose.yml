services:
  ### NGINX ###
  nginx:
    container_name: ft_transcendence_nginx
    image: ft_transcendence_nginx:local
    build:
      context: ./srcs/nginx
      dockerfile: Dockerfile
    env_file:
      - ./srcs/nginx/.env
    ports:
      - "8000:80"
      - "8443:443"
    networks:
      - proxy           # External access
      - backend-network # To reach API Gateway (production-like)
    restart: on-failure
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  ### LITELLM PROXY (inference gateway) ###
  litellm:
    container_name: ft_transcendence_litellm
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-smartbreeds-local}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
    volumes:
      - ./srcs/litellm/config.yaml:/app/config.yaml:ro
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ### OLLAMA (local GPU inference — `local` profile only) ###
  ollama:
    container_name: ollama
    image: ollama/ollama:0.15.4
    profiles: ["local"]
    runtime: nvidia
    entrypoint: ["/workspace/init.sh"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
      - LOG_LEVEL=info
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: all
    volumes:
      - ollama:/root/.ollama
      - models:/models
      - ./srcs/ollama/:/workspace/:rw
    ports:
      - "11434:11434"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - backend-network
    restart: unless-stopped

  ai-service:
    build:
      context: ./srcs/ai
      dockerfile: Dockerfile
    container_name: ft_transcendence_ai_service
    env_file:
      - ./srcs/ai/.env
    networks:
      - backend-network
    volumes:
      - ./srcs/ai/src:/app/src
      - ./srcs/ai/tests:/app/tests
      - ./srcs/ai/data/knowledge_base:/app/data/knowledge_base:ro
      - ai-chroma-data:/app/data/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
### CLASSIFICATION SERVICE ###
  classification-service:
    build:
      context: ./srcs/classification-service
      dockerfile: Dockerfile
    container_name: ft_transcendence_classification_service
    profiles: ["local"]  # heavy HF models + GPU; disabled in cloud profile (VLM-only pipeline)
    env_file:
      - ./srcs/classification-service/.env
    # GPU enabled - RTX 5060 Ti (Blackwell) support via PyTorch 2.11 nightly + CUDA 12.8
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      # DEVICE controlled via .env file (auto/cuda/cpu)
      - TRANSFORMERS_CACHE=/app/.cache/huggingface
      - HF_HOME=/app/.cache/huggingface
    volumes:
      - huggingface-cache:/app/.cache/huggingface
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
