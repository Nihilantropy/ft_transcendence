services:
  ### NGINX ###
  nginx:
    container_name: ft_transcendence_nginx
    image: ft_transcendence_nginx:local
    build:
      context: ./srcs/nginx
      dockerfile: Dockerfile
      additional_contexts:
        frontend: ./srcs/frontend
    env_file:
      - ./srcs/nginx/.env
    volumes:
      # Shared read-only with the `tester` service (make gate), which uses the
      # certificate as its trust anchor. Regenerated on every nginx start.
      - nginx-ssl:/etc/nginx/ssl
    ports:
      - "8000:80"
      - "8443:443"
    networks:
      - proxy           # External access
      - backend-network # To reach API Gateway (production-like)
    # nginx resolves `api-gateway` once, at startup, and exits ("host not found in upstream") if it
    # does not exist yet. The gateway waits for auth/user to be healthy, so without this nginx
    # crash-loops on a fresh start and `up --wait` reports it unhealthy.
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      # `nginx -t` only proved the config parses; this proves TLS + the server block answer.
      test: ["CMD", "curl", "-fsk", "-o", "/dev/null", "https://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s
  ### TESTER (make gate) ###
  # Integration + e2e suite in tests/. Profile `test`: never started by `make up`.
  # Run: docker compose --profile test run --rm tester [pytest args]
  tester:
    build:
      context: ./tests
    profiles: ["test"]
    volumes:
      - ./tests:/tests:ro
      - ./scripts/jupyter/test_data:/test_data:ro
      - nginx-ssl:/nginx-ssl:ro
    networks:
      - backend-network  # api-gateway:8001 (integration)
      - proxy            # nginx:443 (e2e)
  ### LITELLM PROXY (inference gateway) ###
  litellm:
    container_name: ft_transcendence_litellm
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-smartbreeds-local}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
    volumes:
      - ./srcs/litellm/config.yaml:/app/config.yaml:ro
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s

  ### OLLAMA (local GPU inference — `local` profile only) ###
  ollama:
    container_name: ollama
    image: ollama/ollama:0.15.4
    profiles: ["local"]
    runtime: nvidia
    entrypoint: ["/workspace/init.sh"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
      - LOG_LEVEL=info
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: all
    volumes:
      - ollama:/root/.ollama
      - models:/models
      - ./srcs/ollama/:/workspace/:rw
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - backend-network
    restart: unless-stopped

  ai-service:
    build:
      context: ./srcs/ai
      dockerfile: Dockerfile
    container_name: ft_transcendence_ai_service
    env_file:
      - ./srcs/ai/.env
    networks:
      - backend-network
    volumes:
      - ./srcs/ai/src:/app/src
      - ./srcs/ai/tests:/app/tests
      - ./srcs/ai/data/knowledge_base:/app/data/knowledge_base:ro
      - ai-chroma-data:/app/data/chroma
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s
### CLASSIFICATION SERVICE ###
  classification-service:
    build:
      context: ./srcs/classification-service
      dockerfile: Dockerfile
    container_name: ft_transcendence_classification_service
    # No profile and no GPU requirement: this service now runs in every stack,
    # on CPU. It used to be `profiles: ["local"]` with `runtime: nvidia` and a
    # device reservation, so on any machine without a GPU — the evaluation
    # machine included — it simply did not start, and the AI service fell back
    # to a VLM-only path with no NSFW filter and no HuggingFace breed model.
    # That silently removed two claimable modules (image recognition, content
    # moderation) from the evaluated stack. The code never needed the GPU:
    # DEVICE=auto resolves to "cpu" when CUDA is absent (src/main.py).
    #
    # GPU acceleration is opt-in for developer machines:
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml ...
    env_file:
      - ./srcs/classification-service/.env
    environment:
      # DEVICE controlled via .env file (auto/cuda/cpu)
      - TRANSFORMERS_CACHE=/app/.cache/huggingface
      - HF_HOME=/app/.cache/huggingface
    volumes:
      - huggingface-cache:/app/.cache/huggingface
    networks:
      - backend-network
    # It had no restart policy, so a failed model load in the lifespan left the
    # container stopped for good. Now that it is part of the default stack, it
    # must come back on its own.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Four models load before /health answers. On a GPU that took 60-90 s;
      # on CPU, and on a first boot that must also download ~1.3 GB of weights
      # into the empty huggingface-cache volume, it takes considerably longer.
      start_period: 300s
      start_interval: 2s
  # open-webui:
  #   container_name: open-webui
  #   image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
  #   environment:
  #     - MODEL_DOWNLOAD_DIR=/models
  #     - OLLAMA_BASE_URL=http://ollama:11434
  #     - WEBUI_SECRET_KEY=your_secret_key_here  # Add this to prevent logouts after updates
  #   volumes:
  #     - open-webui:/app/backend/data
  #   ports:
  #     - ${OPEN_WEBUI_PORT-3000}:8080
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "5m"
  #       max-file: "2"
  #   depends_on:
  #     - ollama
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   networks:
  #     - backend-network
  #   restart: unless-stopped
### AUTH SERVICE ###
  auth-service:
    container_name: ft_transcendence_auth_service
    image: ft_transcendence_auth_service:local
    build:
      context: ./srcs/auth-service
      dockerfile: Dockerfile
    env_file:
      - ./srcs/auth-service/.env
    volumes:
      # Mount source code for development hot reload
      - ./srcs/auth-service:/app:rw
    networks:
      - backend-network
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s
    depends_on:
      db:
        condition: service_healthy
### USER SERVICE ###
  user-service:
    container_name: ft_transcendence_user_service
    image: ft_transcendence_user_service:local
    build:
      context: ./srcs/user-service
      dockerfile: Dockerfile
    env_file:
      - ./srcs/user-service/.env
    volumes:
      # Mount source code for development hot reload
      - ./srcs/user-service:/app:rw
    networks:
      - backend-network
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s
    depends_on:
      db:
        condition: service_healthy
### REDIS ###
  redis:
    container_name: ft_transcendence_redis
    image: redis:8.4.0-alpine3.22
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - backend-network
    restart: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
### DATABASE ###
  db:
    container_name: ft_transcendence_db
    image: postgres:15-alpine
    env_file:
      - ./srcs/db/.env
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./srcs/db/init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - backend-network
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
### DATABASE BACKUPS (disaster recovery — docs/DISASTER_RECOVERY.md) ###
  # Hourly pg_dump of `smartbreeds`, rotated last/daily/weekly/monthly with hardlinks, written to
  # ./backups/postgres on the HOST: a bind mount, so `make downv` / `purge` / `trash`, which wipe
  # every named volume (db-data included), leave the backups alone. Every dump is restored into a
  # scratch database by the post-backup hook (srcs/db/backup/50-verify) before it counts.
  # Files are root-owned under rootful Docker — deliberate, a stray `rm` can't eat them.
  db-backup:
    container_name: ft_transcendence_db_backup
    image: prodrigestivill/postgres-backup-local:15   # major must match the db image's (pg_dump 15)
    env_file:
      - ./srcs/db/.env
    environment:
      - POSTGRES_HOST=db
      - SCHEDULE=@hourly
      - BACKUP_ON_START=TRUE
      - BACKUP_KEEP_MINS=1440   # last/: every hourly dump for 24 h
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      # --clean --if-exists: the dump drops what it recreates, so it restores over a live database.
      - POSTGRES_EXTRA_OPTS=-Z6 --clean --if-exists
    volumes:
      - ./backups/postgres:/backups
      - ./srcs/db/backup/50-verify:/hooks/50-verify:ro
    networks:
      - backend-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # go-cron's status endpoint; the image's own check polls every 5 min.
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
### API GATEWAY ###
  api-gateway:
    container_name: ft_transcendence_api_gateway
    image: ft_transcendence_api_gateway:local
    build:
      context: ./srcs/api-gateway
      dockerfile: Dockerfile
    env_file:
      - ./srcs/api-gateway/.env
    # No host port. The subject requires every connection to the backend —
    # "from a browser, from a script, from an external API" — to use HTTPS, and
    # this port was plaintext HTTP on 0.0.0.0. All traffic goes through nginx at
    # https://localhost:8443/api. For the Jupyter notebooks and curl-based dev
    # testing, `make up-dev` layers docker-compose.dev.yml on top, which
    # republishes this port bound to 127.0.0.1 only.
    volumes:
      # Mount source code for development hot reload
      - ./srcs/api-gateway/src:/app/src:rw
      - ./srcs/api-gateway/routes:/app/routes:rw
      # Mount tests for development
      - ./srcs/api-gateway/tests:/app/tests:rw
      # Share JWT public key from auth-service (RS256 verification). Generated by `make keys` (which
      # `make up` runs). create_host_path: false makes a missing key an error; with the short syntax
      # Docker would silently create a root-owned *directory* named jwt-public.pem instead.
      - type: bind
        source: ./srcs/auth-service/keys/jwt-public.pem
        target: /app/keys/jwt-public.pem
        read_only: true
        bind:
          create_host_path: false
    networks:
      - backend-network  # Internal only (production-like), NGINX proxies to it
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      redis:
        condition: service_healthy

### RECOMMENDATION SERVICE ###
  recommendation-service:
    build:
      context: ./srcs/recommendation-service
      dockerfile: Dockerfile
    container_name: ft_transcendence_recommendation_service
    restart: unless-stopped
    networks:
      - backend-network
    depends_on:
      user-service:
        condition: service_healthy
    env_file:
      - ./srcs/recommendation-service/.env
    volumes:
      - ./srcs/recommendation-service:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s

### ELK LOGGING STACK (log management — `elk` profile only) ###
# The four ELK secrets below default to empty rather than using Compose's
# `${VAR:?err}` required form. Compose interpolates the whole file on every
# command, including for services whose profile is inactive, so `:?` made
# `make build/up/down/test` and every `docker compose run --rm SERVICE pytest`
# abort before `make elk` had ever generated the credentials. They are
# validated where they are actually needed instead: scripts/init-elk.sh
# generates them, and srcs/elk/setup/entrypoint.sh refuses to provision
# without them.
  elk-setup:
    container_name: ft_transcendence_elk_setup
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-8.17.0}
    profiles: ["elk"]
    user: "0"
    entrypoint: ["/bin/bash", "/setup/entrypoint.sh"]
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-}
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD:-}
      - LOGSTASH_WRITER_PASSWORD=${LOGSTASH_WRITER_PASSWORD:-}
      - HEARTBEAT_WRITER_PASSWORD=${HEARTBEAT_WRITER_PASSWORD:-}
    volumes:
      - elk-certs:/usr/share/elasticsearch/config/certs
      - ./backups/elasticsearch:/usr/share/elasticsearch/snapshots  # host dir: survives downv/purge
      - ./srcs/elk/setup:/setup:ro
      - ./srcs/elk/kibana:/kibana:ro
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      # Gate on .certs-ready, NOT on ca.crt: the CA is written well before the
      # per-node certs are generated and made readable, so testing for ca.crt
      # let Elasticsearch start while its own cert/key did not yet exist.
      # entrypoint.sh creates this marker only once every cert is in place.
      test: ["CMD-SHELL", "test -f /usr/share/elasticsearch/config/certs/.certs-ready"]
      interval: 2s
      timeout: 5s
      retries: 60

  elasticsearch:
    container_name: ft_transcendence_elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-8.17.0}
    profiles: ["elk"]
    depends_on:
      elk-setup:
        condition: service_healthy
    environment:
      - node.name=elasticsearch
      - cluster.name=smartbreeds-logs
      - discovery.type=single-node
      - bootstrap.memory_lock=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.http.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.transport.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=basic
      - path.repo=/usr/share/elasticsearch/snapshots
      # Disk watermarks as absolute free space instead of the 85/90/95 % defaults. On a dev disk the
      # percentages bite long before space is actually short (90 % of 70 GB still leaves 7 GB free):
      # past the high watermark Elasticsearch silently refuses to allocate any shard, so the
      # .security index is never created, elk-setup cannot set a single password, and Kibana and
      # Logstash wait forever. All three must use the same unit.
      - cluster.routing.allocation.disk.watermark.low=2gb
      - cluster.routing.allocation.disk.watermark.high=1gb
      - cluster.routing.allocation.disk.watermark.flood_stage=512mb
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    mem_limit: 1g
    volumes:
      - elk-certs:/usr/share/elasticsearch/config/certs
      - es-data:/usr/share/elasticsearch/data
      - ./backups/elasticsearch:/usr/share/elasticsearch/snapshots  # host dir: survives downv/purge
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'"]
      interval: 10s
      timeout: 10s
      retries: 90
      start_period: 120s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  logstash:
    container_name: ft_transcendence_logstash
    image: docker.elastic.co/logstash/logstash:${STACK_VERSION:-8.17.0}
    profiles: ["elk"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    # Elasticsearch being healthy is not enough: elk-setup creates the logstash_writer user only
    # AFTER Elasticsearch comes up, concurrently with this container starting. A Logstash that wins
    # that race gets a 401, exits ("Could not read Elasticsearch. Please check the credentials"),
    # crash-loops into Docker's restart backoff, and `vector` (which waits for this to be healthy)
    # fails with "dependency failed to start". So wait until our own credentials actually work —
    # that is the precise condition, whatever the timing or the state of the volumes — then hand
    # over to the image's normal entrypoint.
    entrypoint:
      - /bin/sh
      - -c
      - |
        until curl -sf -o /dev/null --cacert config/certs/ca/ca.crt -u "logstash_writer:$${LOGSTASH_WRITER_PASSWORD}" https://elasticsearch:9200/; do
          echo "Waiting for elk-setup to create the logstash_writer user..."
          sleep 3
        done
        exec /usr/local/bin/docker-entrypoint
    environment:
      - LOGSTASH_WRITER_PASSWORD=${LOGSTASH_WRITER_PASSWORD:-}
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    mem_limit: 768m
    volumes:
      - elk-certs:/usr/share/logstash/config/certs:ro
      - ./srcs/elk/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./srcs/elk/logstash/pipeline.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9600 >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  kibana:
    container_name: ft_transcendence_kibana
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-8.17.0}
    profiles: ["elk"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD:-}
      - KIBANA_ENCRYPTION_KEY=${KIBANA_ENCRYPTION_KEY:-}
      - NODE_OPTIONS=--max-old-space-size=512
    mem_limit: 768m
    ports:
      - "5601:5601"
    volumes:
      - elk-certs:/usr/share/kibana/config/certs:ro
      - ./srcs/elk/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -k -s -o /dev/null -w '%{http_code}' https://localhost:5601/api/status | grep -q 200"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Uptime probes for the Kibana status page ("Service Status" dashboard + Uptime app).
  # Monitors live in srcs/elk/heartbeat/heartbeat.yml.
  heartbeat:
    container_name: ft_transcendence_heartbeat
    image: docker.elastic.co/beats/heartbeat:${STACK_VERSION:-8.17.0}
    profiles: ["elk"]
    # Same race as logstash: elk-setup creates heartbeat_writer and the `heartbeat` ILM policy
    # only after Elasticsearch is up. Starting before that, Heartbeat would load its template
    # with its own default ILM policy (no deletion) — so wait until our credentials work.
    entrypoint:
      - /bin/sh
      - -c
      - |
        until curl -sf -o /dev/null --cacert certs/ca/ca.crt -u "heartbeat_writer:$${HEARTBEAT_WRITER_PASSWORD}" https://elasticsearch:9200/_ilm/policy/heartbeat; do
          echo "Waiting for elk-setup to create heartbeat_writer..."
          sleep 3
        done
        # --strict.perms=false: the config is a bind mount whose mode depends on the host checkout.
        exec /usr/bin/tini -s -- /usr/local/bin/docker-entrypoint --environment=container --strict.perms=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - HEARTBEAT_WRITER_PASSWORD=${HEARTBEAT_WRITER_PASSWORD:-}
    mem_limit: 256m
    volumes:
      - elk-certs:/usr/share/heartbeat/certs:ro
      - ./srcs/elk/heartbeat/heartbeat.yml:/usr/share/heartbeat/heartbeat.yml:ro
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:5066/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Replaces Filebeat, which read container logs from
  # /var/lib/docker/containers/*/*.log on the host. That path only holds logs
  # when the Docker daemon's data root is on the same filesystem — i.e. a
  # native Linux Docker Engine. Under Docker Desktop (both dev machines here)
  # the engine keeps them inside its own VM, the bind mount resolved to an
  # empty directory, and Filebeat ran with zero harvesters: the stack shipped
  # nothing at all. Vector reads the same logs through the Docker API instead,
  # which works on Docker Desktop and native Docker alike, and leaves the
  # json-file driver in place so `docker logs` / `make logs` keep working.
  vector:
    container_name: ft_transcendence_vector
    image: timberio/vector:0.43.1-alpine
    profiles: ["elk"]
    user: "0"
    # Explicit: the image's default config path is /etc/vector/vector.yaml, so a
    # mounted vector.toml is ignored and Vector silently runs its bundled demo
    # pipeline instead — which looks like it is working until you read the logs.
    command: ["--config", "/etc/vector/vector.toml"]
    depends_on:
      logstash:
        condition: service_healthy
    mem_limit: 256m
    volumes:
      - elk-certs:/certs:ro
      - ./srcs/elk/vector/vector.toml:/etc/vector/vector.toml:ro
      - vector-data:/var/lib/vector
      # The daemon's socket on the host. scripts/init-elk.sh sets DOCKER_SOCK from the active docker
      # context: under rootless Docker it is /run/user/<uid>/docker.sock, and mounting the system
      # socket there would point Vector at a different daemon that runs none of these containers.
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      # The API listens on 127.0.0.1 only (vector.toml [api]) — nothing outside the container sees it.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8686/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s

### NETWORKS ###
networks:
  proxy:
    driver: bridge
  backend-network:
    driver: bridge

### VOLUMES ###
volumes:
  db-data:
    driver: local
  nginx-ssl:
    driver: local
  redis-data:
    driver: local
  ollama:
    driver: local
  models:
    driver: local
  ai-chroma-data:
    driver: local
  huggingface-cache:
    driver: local
  es-data:
    driver: local
  elk-certs:
    driver: local
  vector-data:
    driver: local
