  #     test: ["CMD", "curl", "-f", "http://localhost:5173"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 30s
### AUTH SERVICE ###
  auth-service:
    container_name: ft_transcendence_auth_service
    image: ft_transcendence_auth_service:local
    build:
      context: ./srcs/auth-service
      dockerfile: Dockerfile
    env_file:
      - ./srcs/auth-service/.env
    volumes:
      # Mount source code for development hot reload
      - ./srcs/auth-service:/app:rw
    networks:
      - backend-network
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
### USER SERVICE ###
  user-service:
    container_name: ft_transcendence_user_service
    image: ft_transcendence_user_service:local
    build:
      context: ./srcs/user-service
      dockerfile: Dockerfile
    env_file:
      - ./srcs/user-service/.env
    volumes:
      # Mount source code for development hot reload
      - ./srcs/user-service:/app:rw
    networks:
      - backend-network
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
### REDIS ###
  redis:
    container_name: ft_transcendence_redis
    image: redis:8.4.0-alpine3.22
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - backend-network
    restart: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
### DATABASE ###
  db:
    container_name: ft_transcendence_db
    image: postgres:15-alpine
    env_file:
      - ./srcs/db/.env
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./srcs/db/init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - backend-network
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER-smartbreeds_user} -d ${POSTGRES_DB-smartbreeds}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
### API GATEWAY ###
  api-gateway:
    container_name: ft_transcendence_api_gateway
    image: ft_transcendence_api_gateway:local
    build:
      context: ./srcs/api-gateway
      dockerfile: Dockerfile
    env_file:
      - ./srcs/api-gateway/.env
    ports:
      - "8001:8001"  # Expose for development testing (curl/Postman)
    volumes:
      # Mount source code for development hot reload
      - ./srcs/api-gateway/src:/app/src:rw
      - ./srcs/api-gateway/routes:/app/routes:rw
      # Mount tests for development
      - ./srcs/api-gateway/tests:/app/tests:rw
      # Share JWT public key from auth-service (RS256 verification)
      - ./srcs/auth-service/keys/jwt-public.pem:/app/keys/jwt-public.pem:ro
    networks:
      - backend-network  # Internal only (production-like), NGINX proxies to it
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy

### RECOMMENDATION SERVICE ###
  recommendation-service:
    build:
      context: ./srcs/recommendation-service
      dockerfile: Dockerfile
    container_name: ft_transcendence_recommendation_service
    restart: unless-stopped
    networks:
      - backend-network
    depends_on:
      - user-service
    env_file:
      - ./srcs/recommendation-service/.env
    volumes:
      - ./srcs/recommendation-service:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

### ELK LOGGING STACK (log management — `elk` profile only) ###
  elk-setup:
    container_name: ft_transcendence_elk_setup
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-8.17.0}
    profiles: ["elk"]
    user: "0"
    entrypoint: ["/bin/bash", "/setup/entrypoint.sh"]
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required — run make elk}
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD:?KIBANA_SYSTEM_PASSWORD is required — run make elk}
      - LOGSTASH_WRITER_PASSWORD=${LOGSTASH_WRITER_PASSWORD:?LOGSTASH_WRITER_PASSWORD is required — run make elk}
    volumes:
      - elk-certs:/usr/share/elasticsearch/config/certs
      - elk-snapshots:/usr/share/elasticsearch/snapshots
      - ./srcs/elk/setup:/setup:ro
      - ./srcs/elk/kibana:/kibana:ro
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/share/elasticsearch/config/certs/ca/ca.crt"]
      interval: 2s
      timeout: 5s
      retries: 60

  elasticsearch:
    container_name: ft_transcendence_elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-8.17.0}
    profiles: ["elk"]
    depends_on:
      elk-setup:
        condition: service_healthy
    environment:
      - node.name=elasticsearch
      - cluster.name=smartbreeds-logs
      - discovery.type=single-node
      - bootstrap.memory_lock=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?ELASTIC_PASSWORD is required — run make elk}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.http.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/elasticsearch/elasticsearch.key
      - xpack.security.transport.ssl.certificate=certs/elasticsearch/elasticsearch.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=basic
      - path.repo=/usr/share/elasticsearch/snapshots
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    mem_limit: 1g
    volumes:
      - elk-certs:/usr/share/elasticsearch/config/certs
      - es-data:/usr/share/elasticsearch/data
      - elk-snapshots:/usr/share/elasticsearch/snapshots
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'"]
      interval: 10s
      timeout: 10s
      retries: 90
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  logstash:
    container_name: ft_transcendence_logstash
    image: docker.elastic.co/logstash/logstash:${STACK_VERSION:-8.17.0}
    profiles: ["elk"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - LOGSTASH_WRITER_PASSWORD=${LOGSTASH_WRITER_PASSWORD:?LOGSTASH_WRITER_PASSWORD is required — run make elk}
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    mem_limit: 768m
    volumes:
      - elk-certs:/usr/share/logstash/config/certs:ro
      - ./srcs/elk/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./srcs/elk/logstash/pipeline.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9600 >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  kibana:
    container_name: ft_transcendence_kibana
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-8.17.0}
    profiles: ["elk"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD:?KIBANA_SYSTEM_PASSWORD is required — run make elk}
      - KIBANA_ENCRYPTION_KEY=${KIBANA_ENCRYPTION_KEY:?KIBANA_ENCRYPTION_KEY is required — run make elk}
      - NODE_OPTIONS=--max-old-space-size=512
    mem_limit: 768m
    ports:
      - "5601:5601"
    volumes:
      - elk-certs:/usr/share/kibana/config/certs:ro
      - ./srcs/elk/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -k -s -o /dev/null -w '%{http_code}' https://localhost:5601/api/status | grep -q 200"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  filebeat:
    container_name: ft_transcendence_filebeat
    image: docker.elastic.co/beats/filebeat:${STACK_VERSION:-8.17.0}
    profiles: ["elk"]
    user: root
    entrypoint: ["filebeat", "-e", "--strict.perms=false"]
    depends_on:
      logstash:
        condition: service_healthy
    mem_limit: 256m
    volumes:
      - elk-certs:/usr/share/filebeat/certs:ro
      - ./srcs/elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - filebeat-data:/usr/share/filebeat/data
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend-network
    restart: unless-stopped

### NETWORKS ###
networks:
  proxy:
    driver: bridge
  backend-network:
    driver: bridge

### VOLUMES ###
volumes:
  db-data:
    driver: local
  redis-data:
    driver: local
  ollama:
    driver: local
  models:
    driver: local
  ai-chroma-data:
    driver: local
  huggingface-cache:
    driver: local
  es-data:
    driver: local
  elk-certs:
    driver: local
  elk-snapshots:
    driver: local
  filebeat-data:
    driver: local
